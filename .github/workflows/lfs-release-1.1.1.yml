name: Publish YiYiBall release asset from LFS

on:
  push:
    branches:
      - release-upload-lfs-1.1.1

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.1.1
      ASSET: YiYiBall-Setup-1.1.1.exe
      EXPECTED_SHA256: 5160D7A77A0E2999025A133B50F8B8F0DC8B01BA1469912BB3CA04F2D361C8D0
      EXPECTED_SIZE: "578447302"
    steps:
      - name: Check out staged installer parts
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Combine and verify installer
        shell: bash
        run: |
          set -euo pipefail
          cat YiYiBall-Setup-1.1.1.exe.part* > "$ASSET"
          test "$(stat -c%s "$ASSET")" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  $ASSET" | sha256sum -c -

      - name: Upload release asset
        shell: bash
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --paginate)
          mapfile -t asset_ids < <(jq -r --arg name "$ASSET" '.[] | select(.name == $name) | .id' <<<"$assets")
          for asset_id in "${asset_ids[@]}"; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done
          gh release upload "$TAG" "$ASSET"
          result=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --paginate)
          jq -e --arg name "$ASSET" --argjson size "$EXPECTED_SIZE" \
            'any(.[]; .name == $name and .state == "uploaded" and .size == $size)' \
            <<<"$result"
          jq -r --arg name "$ASSET" '.[] | select(.name == $name) | .browser_download_url' <<<"$result"
